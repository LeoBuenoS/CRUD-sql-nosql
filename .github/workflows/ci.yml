name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  qualidade:
    name: Lint, formatação e testes (sem banco externo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instala dependências
        run: pip install -r requirements-dev.txt

      - name: Formatação (black)
        run: black --check app tests migrations

      - name: Lint (flake8)
        run: flake8 app tests migrations

      - name: Testes com cobertura
        # Os testes marcados `db` são pulados aqui e rodam no job abaixo.
        run: pytest -q --cov --cov-fail-under=95

  integracao-bancos:
    name: Integração com PostgreSQL e MongoDB reais
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: catalog_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d catalog_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instala dependências
        run: pip install -r requirements-dev.txt

      - name: Testes contra os bancos (inclui as migrations no PostgreSQL)
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://app:app@localhost:5432/catalog_test
          TEST_MONGO_URI: mongodb://localhost:27017
        run: pytest -q -m db
